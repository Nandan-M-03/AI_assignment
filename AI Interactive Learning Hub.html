<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AI Interactive Learning Hub</title>
<style>
:root{--bg:#0b1020;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);--tx:#e8ecf8;--mu:#a3aecb;--ac:#7c9cff;--ok:#34d399;--bad:#f87171;--wa:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fc;--card:rgba(255,255,255,.85);--bd:#d5dbef;--tx:#151a2e;--mu:#555e7a;--ac:#3b5bdb;--ok:#047857;--bad:#b91c1c;--wa:#b45309}}
:root[data-theme="light"]{--bg:#f3f5fc;--card:rgba(255,255,255,.85);--bd:#d5dbef;--tx:#151a2e;--mu:#555e7a;--ac:#3b5bdb;--ok:#047857;--bad:#b91c1c;--wa:#b45309}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(124,156,255,.18),transparent),var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:800;cursor:pointer;margin-right:auto}.brand small{display:block;font-weight:400;color:var(--mu);font-size:.72rem}
nav{display:flex;flex-wrap:wrap;gap:.3rem}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.5rem .9rem;cursor:pointer;transition:transform .15s,border-color .15s}
button:hover{transform:translateY(-1px);border-color:var(--ac)}button:disabled{opacity:.4;cursor:not-allowed}
button.p{background:var(--ac);color:#fff;border-color:transparent;font-weight:600}
:focus-visible{outline:3px solid var(--wa);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.55rem .8rem;max-width:100%}
main{max-width:1000px;margin:0 auto;padding:1.2rem 1rem 2rem;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:1rem 1.2rem;backdrop-filter:blur(10px);margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem}
.grid .card{margin:0;cursor:pointer;transition:transform .2s}.grid .card:hover{transform:translateY(-4px);border-color:var(--ac)}
.hero{text-align:center;padding:2.5rem 0 1.5rem}.hero h1{font-size:clamp(1.8rem,6vw,3.2rem);margin:.2rem 0;letter-spacing:.02em}
.mu{color:var(--mu)}.big{font-size:1.8rem;font-weight:800}
h2{margin:.2rem 0 .6rem}ul{padding-left:1.2rem}
.opt{display:block;width:100%;text-align:left;margin:.4rem 0}.opt.sel{border-color:var(--ac);background:rgba(124,156,255,.2)}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}
svg text{fill:var(--tx);font:13px system-ui}.nd{fill:var(--card);stroke:var(--ac);stroke-width:2}.nd.v{fill:var(--ok);stroke:var(--ok)}.nd.f{stroke:var(--wa)}.nd.c{fill:var(--ac)}.ed{stroke:var(--mu);stroke-width:2}.ed.p{stroke:var(--ok);stroke-width:5}
.chip{display:inline-block;padding:.1rem .6rem;margin:.1rem;border:1px solid var(--bd);border-radius:99px;font-size:.85rem}
.cert{position:relative;overflow:hidden;text-align:center;border:2px solid var(--ac)}
.stamp{position:absolute;top:28%;left:50%;margin-left:-110px;border:6px solid #e11d48;color:#e11d48;font:900 2.6rem/1 Impact,"Arial Black",sans-serif;padding:.15em .5em;letter-spacing:.12em;opacity:.85;transform:rotate(-14deg);animation:st .5s cubic-bezier(.2,2,.4,1) both;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(225,29,72,.06) 6px 8px)}
@keyframes st{from{transform:rotate(-14deg) scale(3);opacity:0}}
.ring{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12}.ring .bg{stroke:var(--bd)}.ring .fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset 1.2s}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}.warn{border-color:var(--wa);color:var(--wa)}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.5rem}
footer{text-align:center;color:var(--mu);padding:1.5rem 1rem;border-top:1px solid var(--bd);font-size:.85rem}
.sr{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="brand" tabindex="0" role="link" onclick="go('home')" onkeydown="if(event.key=='Enter')go('home')">AI Interactive Learning Hub<small>Artificial Intelligence — Learn • Understand • Practice • Test</small></div>
<nav aria-label="Main"><button onclick="go('home')">Home</button><button onclick="go('labs')">Labs</button><button onclick="go('quiz')">Quiz</button><button onclick="go('prog')">Progress</button><button onclick="go('about')">About</button><button onclick="theme()" aria-label="Toggle light or dark theme">◐</button></nav>
<div style="width:100%;position:relative"><label class="sr" for="q">Search AI concepts</label><input id="q" style="width:100%" placeholder="Search AI concepts… e.g. Explain A*, What's PEAS?" oninput="srch(this.value)" autocomplete="off"><div id="sr" class="card" style="display:none;position:absolute;left:0;right:0;z-index:9;margin-top:4px"></div></div></header>
<main id="app" aria-live="polite"></main>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('aih'))}catch(e){}
S=Object.assign({user:null,done:[],used:[],last:null,hist:[],tm:{},dev:false,active:null,theme:null},S||{});
const save=()=>{try{localStorage.setItem('aih',JSON.stringify(S))}catch(e){}};
function theme(){S.theme=(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))=='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save()}
if(S.theme)document.documentElement.dataset.theme=S.theme;
const TN={Fund:'AI Fundamentals',Agents:'Intelligent Agents',Search:'Search',Heur:'Heuristics',Local:'Local Search',CSP:'CSP',Game:'Game Playing',RAI:'Responsible AI'},TM={Fund:0,Agents:1,Search:3,Heur:4,Local:5,CSP:8,Game:11,RAI:14};
// id,icon,title,tag,lab,what,why,example,points
const T=[
['intro','🧠','Introduction to AI','Fund','','AI is the study and design of agents that perceive their environment and act to achieve goals, the way a rational thinker would.','It powers medical image screening, navigation, fraud detection and personalised tutoring.','A spam filter perceives an email, reasons about it and acts by moving it to junk.',['Four views: thinking humanly, acting humanly, thinking rationally, acting rationally','Turing Test (1950): a machine passes if a judge cannot tell it from a human','The term "Artificial Intelligence" was coined at Dartmouth in 1956','Characteristics: learning, reasoning, perception, adaptability','Every deployed system today is narrow AI; general AI is still a research goal']],
['agents','🤖','Intelligent Agents','Fund','','An agent perceives through sensors and acts through actuators. A rational agent maximises expected performance given what it knows.','PEAS gives one standard way to describe any task an agent must solve.','Self-driving car — P: safe, fast trip; E: roads, traffic; A: steering, brakes; S: cameras, lidar.',['PEAS = Performance, Environment, Actuators, Sensors','Five designs: simple reflex, model-based, goal-based, utility-based, learning','Rational does not mean omniscient','Environments can be observable or partial, deterministic or stochastic, episodic or sequential']],
['prob','🧩','Problem Solving','Search','','Problem solving turns a goal into a search for a sequence of actions: formulate the goal, formulate the problem, search, then execute.','Routing, puzzles and planning are all search problems underneath.','8-puzzle: states are tile positions, actions slide the blank, the goal is the ordered board.',['Formulation: initial state, actions, transition model, goal test, path cost','The frontier holds nodes generated but not yet expanded','Judge a method by completeness, optimality, time and space']],
['search','🔍','Search Strategies','Search','s','Uninformed (blind) strategies know only the problem definition. They differ only in which frontier node they expand next.','They are the baseline when no heuristic is available.','BFS finds the route with the fewest steps; uniform-cost search finds the cheapest route.',['BFS: FIFO queue, optimal when step costs are equal, memory O(b^d)','DFS: LIFO stack, memory O(bm), not optimal, can loop in cycles','UCS: priority queue on path cost g(n), optimal for positive costs','Iterative deepening gives BFS completeness with DFS memory']],
['heur','🎯','Heuristics','Heur','s','A heuristic h(n) is an estimate of the cost from n to the goal. It lets search prioritise promising paths.','A good heuristic cuts the number of nodes expanded dramatically.','On the lab map, greedy follows the cheap-looking road S, A, G (cost 10); A* switches to S, B, C, G (cost 7).',['Greedy best-first uses f(n)=h(n): fast but can be misled','A* uses f(n)=g(n)+h(n): optimal when h is admissible','Admissible means h never overestimates the true cost','Design heuristics by relaxing the problem; Manhattan distance beats misplaced tiles']],
['local','⛰️','Local Search','Local','','Local search keeps one current state and moves to better neighbours. The path does not matter, only the final state.','It uses very little memory and suits optimization.','Hill climbing on a landscape climbs the nearest peak, which may not be the tallest.',['Landscape: global maximum, local maximum, plateau, ridge','Hill climbing stops when no neighbour is better','Random restarts help escape poor peaks','Simulated annealing sometimes accepts worse moves, less often as temperature falls']],
['opt','📈','Optimization','Local','','Optimization looks for the best state under an objective function.','Scheduling, routing and design problems are all optimization.','Travelling salesperson: find the shortest tour visiting every city once.',['Classic problems: TSP, N-Queens, scheduling','Genetic algorithms: population, selection, crossover, mutation','Local beam search keeps the best k states out of all successors']],
['partial','🌫️','Partial Observations','Agents','','When the agent cannot see the full state, it reasons about a belief state: the set of states it might be in.','Real robots and chatbots rarely see everything.','Sensorless vacuum world starts with all 8 states possible and each action shrinks the set.',['Sensorless (conformant) planning needs one plan that works from every start','Contingency planning handles nondeterministic actions','A belief state is a set of possible world states']],
['csp','🗺️','Constraint Satisfaction Problems','CSP','c','A CSP has variables, domains (allowed values) and constraints (rules on combinations).','Timetabling, Sudoku and map colouring are CSPs.','Colour a map with 3 colours so that neighbouring regions differ. Try the lab below.',['Variables X, domains D, constraints C','The constraint graph shows structure; Tasmania is independent','Solution = a complete assignment satisfying every constraint']],
['prop','🔗','Constraint Propagation','CSP','c','Propagation uses constraints to shrink domains before and during search.','It detects dead ends early and saves search effort.','With X<Y and domains {1,2,3}, X loses 3 and Y loses 1.',['Node consistency: values satisfy unary constraints','Arc consistency: every value has support in each neighbour','AC-3 revises arcs from a queue until nothing changes','An empty domain means failure']],
['bt','↩️','Backtracking','CSP','c','Backtracking assigns one variable at a time and undoes the last choice when no legal value remains.','It is the standard complete CSP search.','On the map, if SA has no colour left after WA and NT are set, undo and change WA.',['MRV: pick the variable with fewest legal values','Degree heuristic: break ties by most constraints','Least-constraining value: keep options open','Forward checking prunes neighbours after each assignment']],
['game','♟️','Game Playing','Game','g','Games are adversarial search: another agent works against us. We study two-player, turn-taking, zero-sum games with perfect information.','Chess and checkers engines are built on this idea.','Tic-tac-toe is easy to search fully; chess is far too large.',['Formulation: initial state, PLAYER, ACTIONS, RESULT, TERMINAL-TEST, UTILITY','Real-time play uses an evaluation function and a cutoff depth','Optimal play assumes the opponent also plays optimally']],
['minimax','🎲','Minimax','Game','g','MAX picks the largest value, MIN picks the smallest. Values flow up from the leaves.','It gives the best guaranteed outcome against a perfect opponent.','Leaves (3,12,8), (2,4,6), (14,5,2): MIN gives 3, 2, 2; MAX takes 3.',['MIN nodes take the minimum, MAX nodes the maximum','Time O(b^m), space O(bm)','Complete for finite game trees']],
['ab','✂️','Alpha-Beta Pruning','Game','g','Alpha-beta skips branches that cannot change the final decision, giving the same answer as minimax with less work.','Good move ordering lets the search go roughly twice as deep.','After MAX is guaranteed 3, a MIN node that sees 2 cannot help, so its other leaves are pruned.',['Alpha: best MAX can already guarantee; beta: best MIN can guarantee','Prune when alpha ≥ beta','Result is identical to minimax']],
['rai','🛡️','Responsible AI','RAI','r','Responsible AI means deploying systems that are fair, transparent, private, safe and under human oversight.','Chatbots talk to real people, so mistakes have real consequences.','A chatbot confidently quotes a statistic that does not exist — a hallucination.',['Accuracy and hallucination: confident does not mean correct','Bias: models learn from data that may be unfair','Privacy: collect little, protect data','Safety, transparency and human oversight are required']],
['chat','💬','AI Chatbots','RAI','r','A chatbot is an agent that converses with people. Safe deployment is a systematic process.','It shows how agent theory meets real-world risk.','A support bot may answer billing questions but must hand off medical or legal ones.',['Define scope: what it may and may not do','Test and red-team with adversarial prompts','Add guardrails and monitor after launch','Tell users they are talking to an AI']],
['apps','🌍','Applications','Heur','s','Heuristic search powers real systems: GPS routing, game AI and delivery logistics.','It connects classroom algorithms to products students use daily.','A GPS app models roads as a graph and runs A* with straight-line distance as h.',['Straight-line distance never overestimates, so it is admissible','Evaluation functions guide game AI','Logistics uses heuristics to approximate hard routing problems']]];
// tag,difficulty,question,correct,[wrong x3],explanation
const Q=[
['Fund','E','Which approach to AI does the Turing Test measure?','Acting humanly',['Thinking rationally','Acting rationally','Thinking humanly'],'It tests whether behaviour is indistinguishable from a human.'],
['Fund','E','The term "Artificial Intelligence" was coined in:','1956',['1950','1997','2011'],'The Dartmouth workshop of 1956.'],
['Fund','E','Every AI system deployed today is best described as:','Narrow AI',['General AI','Super AI','Conscious AI'],'General AI remains a research goal.'],
['Agents','E','PEAS stands for:','Performance, Environment, Actuators, Sensors',['Planning, Evaluation, Action, Search','Perception, Energy, Algorithm, State','Performance, Efficiency, Accuracy, Speed'],'PEAS describes a task environment.'],
['Agents','M','A thermostat acting only on the current temperature is a:','Simple reflex agent',['Goal-based agent','Utility-based agent','Learning agent'],'It uses condition-action rules on the current percept.'],
['Agents','M','Which agent keeps an internal state to cope with partial observability?','Model-based reflex agent',['Simple reflex agent','Table lookup agent','Random agent'],'The internal model tracks hidden state.'],
['Agents','M','A utility-based agent adds what over a goal-based agent?','A measure of how good an outcome is',['A yes/no goal test','A critic only','A lookup table'],'Utility gives degrees, not just success or failure.'],
['Agents','H','A rational agent is one that:','Maximises expected performance given its knowledge',['Always knows the true outcome','Never makes a mistake','Always explores randomly'],'Rational is not omniscient.'],
['Search','E','The BFS frontier is a:','FIFO queue',['LIFO stack','Priority queue','Hash set'],'Shallowest nodes first.'],
['Search','E','The DFS frontier is a:','LIFO stack',['FIFO queue','Priority queue','Sorted array'],'Deepest nodes first.'],
['Search','M','BFS is optimal when:','All step costs are equal',['Step costs differ widely','The graph is cyclic','h(n) is admissible'],'It finds the shallowest goal.'],
['Search','M','Uniform-cost search expands the node with the lowest:','Path cost g(n)',['Heuristic h(n)','Depth','Branching factor'],'It is a priority queue on g(n).'],
['Search','M','DFS memory requirement is:','O(bm)',['O(b^d)','O(2^b)','O(d!)'],'It stores one path with siblings.'],
['Search','H','Why can DFS fail on cyclic graphs?','It may loop forever without an explored set',['It uses too little memory','It always expands the goal last','It ignores step costs by design'],'Repeated states are never detected.'],
['Search','H','Iterative deepening combines:','DFS memory with BFS completeness',['A* with greedy search','UCS with hill climbing','BFS with minimax'],'It runs depth-limited search with growing limits.'],
['Heur','E','In A*, f(n) equals:','g(n) + h(n)',['h(n) only','g(n) only','g(n) − h(n)'],'Cost so far plus estimated cost to go.'],
['Heur','M','Greedy best-first search orders nodes by:','h(n)',['g(n)','g(n)+h(n)','Depth'],'f(n)=h(n).'],
['Heur','M','An admissible heuristic:','Never overestimates the true cost',['Always equals the true cost','Always overestimates','Ignores the goal'],'h(n) ≤ h*(n).'],
['Heur','H','On the lab map (S-A 1, S-B 2, A-G 9, B-C 2, C-G 3), greedy search returns a path of cost:','10',['7','9','12'],'Greedy goes S, A, G = 1+9.'],
['Heur','H','For the 8-puzzle, Manhattan distance compared with misplaced tiles is:','More informed and still admissible',['Less informed','Inadmissible','Identical'],'It dominates h1 and never overestimates.'],
['Local','E','Hill climbing stops when:','No neighbour is better than the current state',['The goal is reached','Memory is full','The frontier is empty'],'It has reached a peak.'],
['Local','M','A flat region with no improving direction is a:','Plateau',['Ridge','Global maximum','Frontier'],'No signal about where to move.'],
['Local','M','Simulated annealing escapes local maxima by:','Sometimes accepting worse moves',['Restarting every step','Using a queue','Expanding all neighbours'],'The probability falls as temperature decreases.'],
['Local','H','Local beam search keeps:','The best k states out of all successors',['Only one state','All explored states','Random k states only'],'Information is shared between parallel searches.'],
['CSP','E','A CSP consists of:','Variables, domains and constraints',['States, actions and costs','Agents, sensors and actuators','Nodes, edges and weights only'],'The standard definition.'],
['CSP','M','Arc consistency ensures that:','Every value has support in each neighbouring variable',['Every variable is assigned','The graph is a tree','No backtracking is needed'],'Unsupported values are removed.'],
['CSP','M','The MRV heuristic chooses:','The variable with the fewest legal values',['The variable with the most legal values','A random variable','The last variable'],'Fail-first.'],
['CSP','H','With X<Y and domains {1,2,3} each, arc consistency leaves X as:','{1,2}',['{1,2,3}','{2,3}','{3}'],'X=3 needs a larger Y, which does not exist.'],
['Game','E','In minimax, MIN nodes take the:','Smallest child value',['Largest child value','Average','First child'],'MIN minimises MAX’s utility.'],
['Game','M','Alpha-beta pruning changes the minimax result:','Never',['Always','When trees are deep','When MIN has two children'],'It only skips irrelevant branches.'],
['Game','M','Tree: MIN(3,12,8), MIN(2,4,6), MIN(14,5,2). The minimax value at MAX is:','3',['2','12','14'],'MIN gives 3, 2, 2; MAX takes 3.'],
['Game','H','Alpha-beta prunes a branch when:','alpha ≥ beta',['alpha < beta','depth is 3','the node is MAX'],'The branch cannot influence the decision.'],
['RAI','E','A chatbot gives an uncertain answer. The best response is to:','Verify it with reliable sources',['Accept it immediately','Share it publicly','Ignore the uncertainty'],'Confident wording is not evidence.'],
['RAI','M','Plausible but false output from a chatbot is called:','Hallucination',['Overfitting','Backtracking','Pruning'],'The model fabricates facts.'],
['RAI','M','Red-teaming a chatbot means:','Probing it with adversarial prompts',['Making it faster','Training with more data','Hiding its limits'],'It finds failures before users do.']];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const setIdx=k=>shuf(Q.map((_,i)=>i),rng(k*7919+13)).slice(0,25);
let view='home',app=$('#app');
function go(v,a){if(S.active&&v!='quiz'){const e=$('#cn');if(e)e.textContent='A quiz is in progress. Submit it before leaving this page.';return}view=v;clearInterval(sl.t);app.innerHTML='';app.style.animation='none';app.offsetHeight;app.style.animation='';({welcome,home,topic,labs,quiz,prog,about,result})[v](a);scrollTo(0,0)}
function welcome(){app.innerHTML=`<div class="card hero"><h1>Welcome to AI Interactive Learning</h1><p class="mu">Enter your details once. They are stored only in this browser.</p><div style="max-width:340px;margin:auto;text-align:left"><label>Name<input id="n" style="width:100%" autocomplete="name"></label><br><br><label>Roll Number<input id="r" style="width:100%"></label><br><br><label>College / Class (optional)<input id="c" style="width:100%"></label><br><br><button class="p" style="width:100%" onclick="enter()">START LEARNING</button><p id="er" class="warn" role="alert"></p></div></div>`}
function enter(){const n=$('#n').value.trim(),r=$('#r').value.trim();if(!n||!r){$('#er').textContent='Please enter your name and roll number.';return}S.user={n,r,c:$('#c').value.trim()};save();go('home')}
const best=()=>S.hist.length?Math.max(...S.hist.map(h=>h.score)):'—',pc=t=>{const x=S.tm[t];return x&&x[1]?Math.round(100*x[0]/x[1]):null};
function home(){if(!S.user)return go('welcome');const mast=Object.keys(TN).filter(t=>pc(t)>=80).length,pr=Math.round(100*S.done.length/T.length),l=S.hist.at(-1);
app.innerHTML=`<section class="hero"><h1>MASTER ARTIFICIAL INTELLIGENCE</h1><p class="mu">Understand the concepts. Visualize the algorithms. Test your knowledge.</p><div class="row" style="justify-content:center"><button class="p" onclick="go('topic',${Math.min(S.done.length,T.length-1)})">START LEARNING</button><button onclick="go('quiz')">TAKE QUIZ</button></div></section>
<h2>Welcome, ${esc(S.user.n)}</h2><p class="mu">Continue your Artificial Intelligence journey.</p>
<div class="grid" style="margin-bottom:1rem">${[['Overall progress',pr+'%'],['Topics completed',S.done.length+' / '+T.length],['Quiz attempts',S.hist.length],['Best score',best()],['Current score',l?l.score:'—'],['Concepts mastered',mast+' / '+Object.keys(TN).length]].map(x=>`<div class="card" style="cursor:default"><div class="mu">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div>
<div class="bar" aria-label="Overall progress"><i style="width:${pr}%"></i></div><br>
<div class="grid">${T.map((t,i)=>`<div class="card" tabindex="0" role="button" onclick="go('topic',${i})" onkeydown="if(event.key=='Enter')go('topic',${i})"><div style="font-size:1.8rem">${t[1]}</div><b>${i+1}. ${t[2]}</b><div class="mu">${S.done.includes(t[0])?'✓ Completed':'Not started'}</div></div>`).join('')}<div class="card" tabindex="0" role="button" onclick="go('quiz')" onkeydown="if(event.key=='Enter')go('quiz')"><div style="font-size:1.8rem">📝</div><b>18. Final Quiz</b><div class="mu">25 MCQs · +4 / −1</div></div></div>`}
function topic(i){const t=T[i],qs=shuf(Q.filter(q=>q[0]==t[3]),Math.random).slice(0,2);
app.innerHTML=`<button onclick="go('home')">← Dashboard</button><h2 style="margin-top:1rem">${t[1]} ${t[2]}</h2>
<div class="card"><b>What is this?</b><p>${t[5]}</p><b>Why it matters</b><p>${t[6]}</p><b>Example</b><p>${t[7]}</p></div>
<div class="card"><b>Key points</b><ul>${t[8].map(p=>`<li>${p}</li>`).join('')}</ul></div>
${t[4]?`<div class="card" id="lab"></div>`:''}

if(S.active){S.active.ev.reload++;S.active.ev.log.push(new Date().toLocaleTimeString()+' — Page reloaded');save();go('quiz')}else go(S.user?'home':'welcome');
</script></body></html>
